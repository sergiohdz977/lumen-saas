components:
  schemas:
    BookingRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_username:
          type: string
          readOnly: true
        package:
          type: integer
        package_title:
          type: string
          readOnly: true
        profile_slug:
          type: string
          readOnly: true
        date:
          type: string
          format: date-time
        message:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_username
      - date
      - id
      - package
      - package_title
      - profile_slug
      - status
    BookingRequestRequest:
      type: object
      properties:
        package:
          type: integer
        date:
          type: string
          format: date-time
        message:
          type: string
      required:
      - date
      - package
    BookingStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
          description: Linked account, if any (set when a booking is accepted)
        name:
          type: string
          maxLength: 120
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - user
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
      required:
      - name
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        photo:
          type: integer
        photo_caption:
          type: string
          readOnly: true
        photo_thumbnail:
          type: string
          readOnly: true
        customer_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_username
      - id
      - photo
      - photo_caption
      - photo_thumbnail
    FavoriteRequest:
      type: object
      properties:
        photo:
          type: integer
      required:
      - photo
    Gallery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        shoot:
          type: integer
        shoot_title:
          type: string
          readOnly: true
        client_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_username
      - created_at
      - id
      - shoot
      - shoot_title
    GalleryRequest:
      type: object
      properties:
        shoot:
          type: integer
      required:
      - shoot
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_read
      - message
      - title
    Package:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profile_slug:
          type: string
          readOnly: true
        studio_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 150
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - id
      - price
      - profile_slug
      - studio_name
      - title
    PackageRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - price
      - title
    PaginatedBookingRequestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookingRequest'
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PaginatedFavoriteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
