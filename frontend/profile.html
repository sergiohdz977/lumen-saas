<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen — Photographer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Lumen<span class="logo-dot">.</span></a>
      <nav class="nav">
        <a href="index.html#photographers">Photographers</a>
        <a href="dashboard.html">Dashboard</a>
        <span id="auth-area">
          <button id="btn-login" class="btn btn-ghost">Log in</button>
          <span id="auth-user" hidden>
            <span class="auth-greeting">
              Hi, <strong id="auth-username"></strong>
            </span>
            <button id="btn-logout" class="btn btn-ghost">Log out</button>
          </span>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html#photographers">← Back to photographers</a>

    <p id="profile-status" class="status">Loading profile…</p>

    <section id="profile-view" hidden>
      <div class="panel profile-hero">
        <div class="profile-top">
          <div class="avatar avatar-lg" id="p-avatar">?</div>
          <div class="profile-headings">
            <h1 id="p-studio"></h1>
            <p class="meta" id="p-meta"></p>
            <div class="chips" id="p-chips"></div>
          </div>
          <span class="badge badge-pro" id="p-plan" hidden>PRO</span>
        </div>
        <p class="profile-bio" id="p-bio"></p>
        <p class="meta" id="p-phone" hidden></p>
      </div>
    </section>

    <section id="packages-section" class="detail-section" hidden>
      <h2 class="section-title-lg">Packages</h2>
      <div class="packages-grid" id="packages-grid"></div>
    </section>

    <section id="portfolio-section" class="detail-section" hidden>
      <h2 class="section-title-lg">Portfolio</h2>
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      Lumen — photography booking platform · API powered by Django REST Framework
    </div>
  </footer>

  <script src="js/profile.js"></script>
</body>
</html>
